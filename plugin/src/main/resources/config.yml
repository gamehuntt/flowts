# ======================= Flowt =======================
# 1) In your Discord server run /flowt create (you need the Manage Server permission).
#    The bot shows your API key once - paste it below (it starts with "flowt_").
# 2) Run /flowt reload  (or restart the server).
# The key already contains the address of the Flowt service, so nothing else is needed here.
# Link accounts:  /discord link  (in game)  or  /link  (in Discord) - both ways work.

api-key: "PASTE_YOUR_SERVER_KEY_HERE"

# Shown by /discord (optional)
discord-invite: ""

# Minecraft chat -> Discord
chat-to-discord: true
# Discord chat -> Minecraft
discord-to-minecraft: true
# Placeholders: {author} {message}
discord-chat-format: "&9[Discord] &f{author}&7: &f{message}"

# Which game events are sent to Discord
events:
  join: true
  quit: true
  death: true
  advancement: true

teams:
  enabled: true
  max-members: 10
  friendly-fire: false
  score-per-kill: 1
  home-cooldown-seconds: 10
