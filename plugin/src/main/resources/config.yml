# ======================= Flowt =======================
# Nothing to set up here:
#   1) In Discord run /connect  (Manage Server permission)  and then /connect <code> in Minecraft
#      - or run /connect in Minecraft and /connect <code> in Discord, whichever you like.
#   2) Players link their accounts with /account connect (in Minecraft or Discord).
# The connection is saved automatically in plugins/Flowt/connection.yml - do not share that file.

# Name shown for this server in Discord (empty = first line of server.properties motd)
server-name: ""

# Shown by /discord (optional)
discord-invite: ""

# Minecraft chat -> Discord
chat-to-discord: true
# Discord chat -> Minecraft
discord-to-minecraft: true
# Placeholders: {author} {message}
discord-chat-format: "&9[Discord] &f{author}&7: &f{message}"

# Which game events are sent to Discord
events:
  join: true
  quit: true
  death: true
  advancement: true

teams:
  enabled: true
  max-members: 10
  friendly-fire: false
  score-per-kill: 1
  home-cooldown-seconds: 10
