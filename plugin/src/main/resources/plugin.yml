name: Flowt
version: ${project.version}
main: app.flowt.FlowtPlugin
api-version: '1.21'
description: Connects your server to Discord with the shared Flowt bot, plus global teams.

commands:
  connect:
    description: Connect this server to Discord
    usage: /<command> [code]
  account:
    description: Link your Minecraft account to Discord
    usage: /<command> connect [code]
  discord:
    description: Discord info and account linking
    aliases: [discordsrv, dsrv]
    usage: /<command> [link [code]]
  flowt:
    description: Flowt admin commands
    usage: /<command> <connect [code]|status|reload|disconnect>
  team:
    description: Team commands
    aliases: [t, teams]
    usage: /<command> help
  teama:
    description: Team admin commands
    aliases: [teamadmin]
    usage: /<command> <disband|score|info|list>

permissions:
  flowt.admin:
    description: Flowt and team admin commands
    default: op
  flowt.team:
    description: Use team commands
    default: true
  flowt.link:
    description: Link your Discord account
    default: true
